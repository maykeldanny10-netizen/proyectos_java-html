<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI CORAZON</title>
    <style>
        .heart {
            width: 100px;
            height: 100px;
            background: crimson;
            transform: rotate(-45deg);
            position: relative;
            animation: beat 1.2s ease-in-out infinite;
        }
        .heart::before{
            content: "";
            width: 100px;
            height: 100px;
            background: crimson;
            border-radius: 50%;
            position: absolute;
            top: -50px;
            left: 0;
        }
        .heart::after{
            content: "";
            width: 100px;
            height: 100px;
            background: crimson;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 50px;
        }
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a0d12;
        }
        @keyframes beat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }
            50% {
                transform: rotate(-45deg) scale(1.15);
            }
        }
        #mensaje {
            display: none;
            color: white;
            text-align: center;
            margin-top: 220px;
        }
        #pantallaNombre{
            text-align: center;
            color: white;
        }
        #inputNombre{
            padding: 8px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
        }
        #botonEnviar {
            padding: 8px 16px;
            margin-left: 8px;
            border-radius: 6px;
            border: none;
            background: crimson;
            color: white;
            cursor: pointer;
}
    </style>
</head>
<body>
    <div id = "pantallaCorazon" style="display: none;">
        <div class="heart"></div>
        <p id="mensaje"></p>
    </div>
    <div id = "pantallaNombre"></div>
    <p>ingrese su nombre</p>
    <input type="text" id="inputNombre" placeholder="Tu nombre">
    <button id = "botonEnviar" >Enviar</button>
    <div class="heart"></div>
    <p id="mensaje"> te quiero mucho</p>
    <script>
        const botonEnviar = document.getElementById('botonEnviar');
        const inputNombre = document.getElementById('inputNombre');
        const pantallaNombre = document.getElementById('pantallaNombre');
        const pantallaCorazon = document.getElementById('pantallaCorazon');
        const mensaje = document.getElementById('mensaje');
        const corazon = document.querySelector('.heart');

        botonEnviar.addEventListener('click', function() {
        const nombre = inputNombre.value;
        pantallaNombre.style.display = 'none';
        pantallaCorazon.style.display = 'block';
        });

        corazon.addEventListener('click', function() {
        const nombre = inputNombre.value;
        mensaje.textContent = 'Te quiero mucho, ' + nombre;
        mensaje.style.display = 'block';
        });
    </script>
</body>
</html>
